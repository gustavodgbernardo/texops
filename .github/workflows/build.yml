# Builds the paper in the project's Docker image and publishes the PDFs.
# - On pull requests: builds main.pdf and diff.pdf (changes vs. the base branch)
#   and comments on the PR with links to them.
# - On pushes to main: publishes the latest main.pdf.
#
# Where the PDFs go depends on PREVIEW_MODE (repository variable):
# - release (default for private repositories): attached to a pre-release per PR
#   (`preview-pr-<number>`) and to `preview-main`. Only people with access to
#   the repository can download them. Nothing is added to the git history.
# - pages (default for public repositories): committed to the `pdf-builds`
#   branch and opened in the browser through GitHub Pages (if enabled).
name: Build PDF

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write
  pages: read # to link PDFs through GitHub Pages when it is enabled

concurrency:
  group: pdf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_MODE: ${{ vars.PREVIEW_MODE || (github.event.repository.private && 'release' || 'pages') }}
  PUBLISH_BRANCH: pdf-builds
  TARGET: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  # PRs from forks get a read-only token, so they only get the workflow artifact.
  CAN_PUBLISH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # latexdiff needs the base branch history

      - uses: docker/setup-buildx-action@v4

      - name: Build TeX image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: texops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build paper
        run: docker run --rm -v "$PWD":/workspace -w /workspace --user root texops:ci make pdf

      - name: Build diff
        id: diff
        if: github.event_name == 'pull_request'
        continue-on-error: true # a latexdiff failure must not block the review
        run: >
          docker run --rm -v "$PWD":/workspace -w /workspace --user root texops:ci
          make diff BASE=origin/${{ github.base_ref }}

      - name: Collect PDFs
        run: |
          mkdir -p publish
          cp build/main.pdf publish/
          if [ -f build/diff.pdf ]; then cp build/diff.pdf publish/; fi

      - uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: publish/

      - name: Publish to release preview-${{ env.TARGET }}
        if: env.CAN_PUBLISH == 'true' && env.PREVIEW_MODE == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TITLE: ${{ github.event_name == 'pull_request' && format('Preview: PR #{0}', github.event.pull_request.number) || 'Preview: main' }}
        run: |
          tag="preview-$TARGET"
          # Recreate the release so its tag follows the latest commit; the
          # download URLs (…/releases/download/<tag>/<file>) stay the same.
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" publish/*.pdf --target "$SHA" --prerelease --latest=false \
            --title "$TITLE" --notes "PDFs built by CI from ${SHA:0:7}. Updated on every push; deleted when the pull request is closed."

      - name: Publish to ${{ env.PUBLISH_BRANCH }}
        if: env.CAN_PUBLISH == 'true' && env.PREVIEW_MODE == 'pages'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ env.PUBLISH_BRANCH }}
          publish_dir: ./publish
          destination_dir: ${{ env.TARGET }}
          keep_files: true
          commit_message: "Publish PDFs for ${{ github.sha }}"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && env.CAN_PUBLISH == 'true'
        uses: actions/github-script@v9
        env:
          DIFF_OK: ${{ steps.diff.outcome == 'success' }}
        with:
          script: |
            const marker = '<!-- texops-pdf -->';
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            let url, note;
            if (process.env.PREVIEW_MODE === 'release') {
              url = `${repoUrl}/releases/download/preview-pr-${pr}`;
              note = 'Downloads require access to this repository.';
            } else {
              // Prefer GitHub Pages (served as application/pdf, opens in the browser);
              // fall back to the file view on the branch if Pages is not enabled.
              url = `${repoUrl}/blob/${process.env.PUBLISH_BRANCH}/pr-${pr}`;
              note = 'Links may take a minute to update.';
              try {
                const { data: pages } = await github.rest.repos.getPages(context.repo);
                url = `${pages.html_url.replace(/\/$/, '')}/pr-${pr}`;
              } catch (e) {
                core.info('GitHub Pages not enabled, linking to the branch instead.');
              }
            }
            const diff = process.env.DIFF_OK === 'true'
              ? `🔴🔵 [**Changes (diff.pdf)**](${url}/diff.pdf)`
              : '⚠️ Diff could not be built, see the workflow logs.';
            const body = [
              marker,
              '### 📄 PDF preview',
              '',
              `📄 [**Paper (main.pdf)**](${url}/main.pdf)`,
              diff,
              '',
              `<sub>Built from ${sha} · [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) · ${note}</sub>`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }
