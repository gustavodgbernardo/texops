# Builds the paper in the project's Docker image.
# - On pull requests: builds main.pdf and diff.pdf (changes vs. the base branch),
#   publishes them to the `pdf-builds` branch under pr-<number>/ and comments
#   on the PR with links that open the PDFs directly in the browser.
# - On pushes to main: publishes main.pdf under main/.
name: Build PDF

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pdf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PUBLISH_BRANCH: pdf-builds
  # PRs from forks get a read-only token, so they only get the workflow artifact.
  CAN_PUBLISH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # latexdiff needs the base branch history

      - uses: docker/setup-buildx-action@v3

      - name: Build TeX image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: texops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build paper
        run: docker run --rm -v "$PWD":/workspace -w /workspace --user root texops:ci make pdf

      - name: Build diff
        id: diff
        if: github.event_name == 'pull_request'
        continue-on-error: true # a latexdiff failure must not block the review
        run: >
          docker run --rm -v "$PWD":/workspace -w /workspace --user root texops:ci
          make diff BASE=origin/${{ github.base_ref }}

      - name: Collect PDFs
        run: |
          mkdir -p publish
          cp build/main.pdf publish/
          if [ -f build/diff.pdf ]; then cp build/diff.pdf publish/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: publish/

      - name: Publish to ${{ env.PUBLISH_BRANCH }}
        if: env.CAN_PUBLISH == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ env.PUBLISH_BRANCH }}
          publish_dir: ./publish
          destination_dir: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          keep_files: true
          commit_message: "Publish PDFs for ${{ github.sha }}"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && env.CAN_PUBLISH == 'true'
        uses: actions/github-script@v7
        env:
          DIFF_OK: ${{ steps.diff.outcome == 'success' }}
        with:
          script: |
            const marker = '<!-- texops-pdf -->';
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${process.env.PUBLISH_BRANCH}/pr-${pr}`;
            const diff = process.env.DIFF_OK === 'true'
              ? `🔴🔵 [**Changes (diff.pdf)**](${url}/diff.pdf)`
              : '⚠️ Diff could not be built, see the workflow logs.';
            const body = [
              marker,
              '### 📄 PDF preview',
              '',
              `📄 [**Paper (main.pdf)**](${url}/main.pdf)`,
              diff,
              '',
              `<sub>Built from ${sha} · [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})</sub>`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }
