# Removes a PR's PDFs from the `pdf-builds` branch once the PR is closed.
name: Clean up PR PDFs

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pdf-builds

      - name: Remove pr-${{ github.event.pull_request.number }}/
        run: |
          dir="pr-${{ github.event.pull_request.number }}"
          [ -d "$dir" ] || { echo "nothing to clean"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -r --quiet "$dir"
          git commit -m "Remove PDFs of closed PR #${{ github.event.pull_request.number }}"
          git push
