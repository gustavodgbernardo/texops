# Removes a PR's PDFs once the PR is closed: its pre-release (release mode)
# and its folder in the `pdf-builds` branch (pages mode).
name: Clean up PR PDFs

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

env:
  PR_DIR: pr-${{ github.event.pull_request.number }}

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete release preview-${{ env.PR_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "preview-$PR_DIR" --cleanup-tag --yes 2>/dev/null || echo "no release to delete"

      - name: Check for pdf-builds branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/pdf-builds" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.branch.outputs.exists == 'true'
        with:
          ref: pdf-builds

      - name: Remove ${{ env.PR_DIR }}/ from pdf-builds
        if: steps.branch.outputs.exists == 'true'
        run: |
          [ -d "$PR_DIR" ] || { echo "nothing to clean"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -r --quiet "$PR_DIR"
          git commit -m "Remove PDFs of closed PR #${{ github.event.pull_request.number }}"
          git push
