# Removes a PR's PDFs from the `pdf-builds` branch once the PR is closed
# (in this repository, or in the preview repository when PREVIEW_REPO is set).
name: Clean up PR PDFs

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

env:
  PREVIEW_REPO: ${{ vars.PREVIEW_REPO }}

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PREVIEW_REPO || github.repository }}
          ssh-key: ${{ env.PREVIEW_REPO && secrets.PREVIEW_DEPLOY_KEY || '' }}
          ref: pdf-builds

      - name: Remove the PR folder
        env:
          DIR: ${{ env.PREVIEW_REPO && format('{0}/', github.event.repository.name) || '' }}pr-${{ github.event.pull_request.number }}
        run: |
          [ -d "$DIR" ] || { echo "nothing to clean"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -r --quiet "$DIR"
          git commit -m "Remove PDFs of closed PR ${{ github.repository }}#${{ github.event.pull_request.number }}"
          git push
